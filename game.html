<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pallet Flow: Depot Manager</title>
<meta name="description" content="Run a distribution network. Depots, forklifts, multi-drop truck routes, delivery windows, fuel, wages and store contracts.">
<style>
:root{--bg:#e6e4de;--card:#fbfaf7;--deep:#efede7;--line:#cbc8bf;--ink:#1d1f21;--dim:#5c6066;--acc:#ffd200;--good:#1e8e4e;--bad:#c8281e;--blue:#1f5fa8;--sign:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.hud{position:sticky;top:0;z-index:5;background:#1d1f21;margin-bottom:6px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(-45deg,#ffd200 0 10px,#1d1f21 10px 20px)}
.hud .pos{color:#5fd38a!important}.hud .neg{color:#ff7466!important}
.hud div{min-width:0}.hud small{display:block;color:#b9bcc0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.hud b{color:#ffd200;font-family:var(--sign);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .x{display:none}
main{padding:12px 12px 60px;display:grid;gap:12px;grid-template-columns:1fr}
.left{min-width:0}
.map{position:relative}
canvas{display:block;width:100%;aspect-ratio:360/440;touch-action:none;cursor:grab;border-radius:6px;background:#6d8a55;border:2px solid #1d1f21}
.mapbtn{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}.mapbtn button{min-height:36px;padding:4px 10px;font-size:13px;background:rgba(255,255,255,.92)}
.kpis{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}.kpis::-webkit-scrollbar{display:none}
.kpi{flex:none;min-width:92px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
.kpi small{display:block;color:var(--dim);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.kpi b{font-family:var(--sign);font-size:19px;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:6px;margin-bottom:8px}
button{background:#fff;color:var(--ink);border:1.5px solid #1d1f21;font:inherit;font-weight:600;padding:8px 12px;border-radius:6px;cursor:pointer;min-height:42px}
button.on{background:#1d1f21;border-color:#1d1f21;color:#ffd200;font-weight:700}
button.pri{background:var(--acc);border-color:#1d1f21;color:#1d1f21;font-weight:700}
button:disabled{opacity:.4;cursor:default}
.bar button{flex:1;padding:8px 4px}
.advice{background:#fff;border:1px solid var(--line);border-left:6px solid var(--good);border-radius:6px;font-weight:600;padding:9px 12px;font-size:14px;margin-bottom:8px;min-height:42px}
.toast{font-size:13px;color:var(--dim);min-height:20px;margin-bottom:8px}
.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button{flex:1;padding:8px 1px;font-family:var(--sign);font-size:14px;text-transform:uppercase;letter-spacing:.02em}
.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid #1d1f21;border-radius:6px;padding:14px}
h3{margin:0 0 4px;font-family:var(--sign);font-size:19px;text-transform:uppercase;letter-spacing:.03em}h3:not(:first-child){margin-top:16px}
p{margin:0 0 8px;color:var(--dim);font-size:14px}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.rowx:first-of-type{border-top:0}
.rowx .t{min-width:0}.rowx .t b{display:block}.rowx .t span{color:var(--dim);font-size:13px}
.rowx button{flex:none}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 2px;font-size:13px;line-height:1.25}
.seg small{display:block;color:inherit;opacity:.75;font-size:11px}
.chips{display:flex;gap:4px;margin-bottom:12px}.chips button{flex:1;font-family:var(--sign);font-size:15px;text-transform:uppercase;padding:6px 4px;min-height:38px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 0;border-top:1px solid var(--line);color:var(--dim)}
td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}tr.tot td{color:var(--ink);font-weight:700;border-top:2px solid var(--line)}
.pos{color:var(--good)!important}.neg{color:var(--bad)!important}
.meter{height:8px;background:#d9d6ce;border-radius:4px;overflow:hidden;margin-top:4px;width:110px;flex:none}.meter i{display:block;height:100%;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.8);z-index:10;display:none;align-items:flex-start;justify-content:center;padding:20px 14px;overflow:auto}
.modal.show{display:flex}
.box{background:var(--card);border:2px solid #1d1f21;border-top:10px solid #ffd200;border-radius:8px;padding:20px;max-width:520px;width:100%;margin:auto}
.box h2{margin:0 0 6px;font-family:var(--sign);font-size:30px;line-height:1.05;text-transform:uppercase}
.box ul,ul.cond{list-style:none;padding:0;margin:4px 0 10px;font-size:14px;color:var(--ink)}.box li,ul.cond li{padding:3px 0}.box li b{color:var(--ink)}
.box h3{margin:0}
.offer{background:#fff6c9;border:1.5px solid #1d1f21;border-radius:6px;padding:12px;margin:12px 0}
.box .go{width:100%;margin-top:10px;font-size:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#1d1f21;color:#ffd200;margin-left:4px;vertical-align:middle}
.truck{border-top:1px solid var(--line);padding-bottom:8px}.truck .rowx{border:0;padding-bottom:4px}.trow{display:flex;gap:6px}
select{font:inherit;padding:8px;border:1.5px solid #1d1f21;border-radius:6px;background:#fff;color:var(--ink);min-height:42px}
.trow select{flex:1;min-width:0}.trow button{padding:8px 9px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:3px;height:60px;margin:6px 0 8px}.bars i{flex:1;border-radius:2px 2px 0 0;max-width:22px}
.fkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.fkgrid label{font-size:13px;color:var(--dim)}.fkgrid select{display:block;width:100%;min-height:40px}
.run{border-top:1px solid var(--line);padding:8px 0}.run>span{display:block;color:var(--dim);font-size:13px}.stop{font-size:13px;padding-left:10px;color:var(--dim)}
a{color:var(--blue)}
@media(min-width:1000px){
  body{height:100vh;overflow:hidden;display:flex;flex-direction:column}
  .hud{position:relative;grid-template-columns:repeat(7,1fr);padding:8px 18px;flex:none}.hud .x{display:block}
  main{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 470px;padding:12px 14px 10px;gap:14px}
  .left{display:flex;flex-direction:column;min-height:0}
  .map{flex:1;min-height:0}canvas{height:100%;aspect-ratio:auto}
  .kpis{flex-wrap:wrap;overflow:visible}.kpi{flex:1 1 100px}
  .side{overflow-y:auto;min-height:0;padding-right:4px}
  .keys{display:block!important}
}
.keys{display:none;font-size:12px;color:var(--dim);margin:-2px 0 8px}
</style>
</head>
<body>
<div class="hud">
  <div><small id="hDay">Day 1</small><b id="hTime">06:00</b></div>
  <div><small>Cash</small><b id="hCash">$0</b></div>
  <div><small>Today</small><b id="hToday">$0</b></div>
  <div class="x"><small>Net worth</small><b id="hNet"></b></div>
  <div class="x"><small>Shelves stocked</small><b id="hAv"></b></div>
  <div class="x"><small>Drops on time</small><b id="hOt"></b></div>
  <div class="x"><small>Loads / drops</small><b id="hLd"></b></div>
</div>
<main>
  <div class="left">
    <div class="map"><canvas id="c"></canvas><div class="mapbtn"><button data-act="view:depot">Depot</button><button data-act="view:map">Map</button><button data-act="zoom:1.35">+</button><button data-act="zoom:.74">−</button></div></div>
    <div class="kpis" id="kpis"></div>
  </div>
  <div class="side">
    <div class="bar" id="speed">
      <button data-act="speed:0">❚❚</button><button data-act="speed:1">1×</button><button data-act="speed:2">2×</button><button data-act="speed:4">4×</button><button data-act="speed:8">8×</button>
    </div>
    <div class="keys">Keys: space pauses, 1 to 4 set speed. Drag the map, scroll to zoom.</div>
    <div class="advice" id="advice">Good morning.</div>
    <div class="toast" id="toast"></div>
    <div class="tabs" id="tabs">
      <button data-act="tab:team">Depot</button><button data-act="tab:fleet">Fleet</button><button data-act="tab:stores">Stores</button><button data-act="tab:runs">Runs</button><button data-act="tab:invest">Invest</button><button data-act="tab:ledger">Ledger</button>
    </div>
    <div class="panel" id="panel"></div>
    <p style="margin-top:12px;font-size:13px"><a href="./">← Back to the simple simulation</a></p>
  </div>
</main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script src="game.js"></script>
</body>
</html>
