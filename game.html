<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pallet Flow: Depot Manager</title>
<meta name="description" content="Run a distribution depot. Hire forklift operators, lease trucks, win store contracts, and stay in profit.">
<style>
:root{--bg:#e6e4de;--card:#fbfaf7;--deep:#efede7;--line:#cbc8bf;--ink:#1d1f21;--dim:#5c6066;--acc:#ffd200;--good:#1e8e4e;--bad:#c8281e;--blue:#1f5fa8;--sign:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.hud{position:sticky;top:0;z-index:5;background:#1d1f21;margin-bottom:6px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(-45deg,#ffd200 0 10px,#1d1f21 10px 20px)}
.hud .pos{color:#5fd38a!important}.hud .neg{color:#ff7466!important}
.hud div{min-width:0}.hud small{display:block;color:#b9bcc0;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.hud b{color:#ffd200;font-family:var(--sign);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:12px 12px 60px;display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:820px){main{grid-template-columns:minmax(0,430px) 1fr;align-items:start}}
canvas{display:block;width:100%;aspect-ratio:360/570;border-radius:6px;background:#6d8a55;border:2px solid #1d1f21}
.bar{display:flex;gap:6px;margin-bottom:8px}
button{background:#fff;color:var(--ink);border:1.5px solid #1d1f21;font:inherit;font-weight:600;padding:8px 12px;border-radius:6px;cursor:pointer;min-height:42px}
button.on{background:#1d1f21;border-color:#1d1f21;color:#ffd200;font-weight:700}
button.pri{background:var(--acc);border-color:#1d1f21;color:#1d1f21;font-weight:700}
button:disabled{opacity:.4}
.bar button{flex:1;padding:8px 4px}
.advice{background:#fff;border:1px solid var(--line);border-left:6px solid var(--good);border-radius:6px;font-weight:600;padding:9px 12px;font-size:14px;margin-bottom:8px;min-height:42px}
.toast{font-size:13px;color:var(--dim);min-height:20px;margin-bottom:8px}
.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button{flex:1;padding:8px 2px;font-family:var(--sign);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid #1d1f21;border-radius:6px;padding:14px}
h3{margin:0 0 4px;font-family:var(--sign);font-size:19px;text-transform:uppercase;letter-spacing:.03em}h3:not(:first-child){margin-top:16px}
p{margin:0 0 8px;color:var(--dim);font-size:14px}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.rowx:first-of-type{border-top:0}
.rowx .t{min-width:0}.rowx .t b{display:block}.rowx .t span{color:var(--dim);font-size:13px}
.rowx button{flex:none}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 2px;font-size:13px;line-height:1.25}
.seg small{display:block;color:inherit;opacity:.75;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 0;border-top:1px solid var(--line);color:var(--dim)}
td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}tr.tot td{color:var(--ink);font-weight:700;border-top:2px solid var(--line)}
.pos{color:var(--good)!important}.neg{color:var(--bad)!important}
.meter{height:8px;background:#d9d6ce;border-radius:4px;overflow:hidden;margin-top:4px;width:120px}.meter i{display:block;height:100%;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.8);z-index:10;display:none;align-items:flex-start;justify-content:center;padding:20px 14px;overflow:auto}
.modal.show{display:flex}
.box{background:var(--card);border:2px solid #1d1f21;border-top:10px solid #ffd200;border-radius:8px;padding:20px;max-width:460px;width:100%;margin:auto}
.box h2{margin:0 0 6px;font-family:var(--sign);font-size:30px;line-height:1.05;text-transform:uppercase}
.box ul{margin:6px 0 12px;padding-left:18px;color:var(--dim);font-size:14px}.box li{margin-bottom:4px}.box li b{color:var(--ink)}
.offer{background:#fff6c9;border:1.5px solid #1d1f21;border-radius:6px;padding:12px;margin:12px 0}
.box .go{width:100%;margin-top:10px;font-size:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#1d1f21;color:#ffd200;margin-left:4px}
a{color:var(--blue)}
</style>
</head>
<body>
<div class="hud">
  <div><small id="hDay">Day 1</small><b id="hTime">06:00</b></div>
  <div><small>Cash</small><b id="hCash">$0</b></div>
  <div><small>Today</small><b id="hToday">$0</b></div>
</div>
<main>
  <canvas id="c"></canvas>
  <div>
    <div class="bar" id="speed">
      <button data-act="speed:0">❚❚</button><button data-act="speed:1">1×</button><button data-act="speed:2">2×</button><button data-act="speed:4">4×</button><button data-act="speed:8">8×</button>
    </div>
    <div class="advice" id="advice">Good morning.</div>
    <div class="toast" id="toast"></div>
    <div class="tabs" id="tabs">
      <button data-act="tab:team">Depot</button><button data-act="tab:fleet">Fleet</button><button data-act="tab:stores">Stores</button><button data-act="tab:ledger">Ledger</button>
    </div>
    <div class="panel" id="panel"></div>
    <p style="margin-top:12px;font-size:13px"><a href="./">← Back to the simple simulation</a></p>
  </div>
</main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
const $=s=>document.querySelector(s),money=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-AU');
const W=360,H=570,DOOR_Y=150,HOLD_Y=260,OUT_Y=304,BACK_Y=320,RACK_Y=44,DOCK_X=[60,140,220,300],HOLD_X=[20,100,180,260,340];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],KEY='palletflow-game-v1';
const TYPES={van:{n:'Van',cap:4,lease:90,km:.35,kmh:55,len:30},rigid:{n:'Rigid',cap:10,lease:160,km:.75,kmh:50,len:44},semi:{n:'Semi',cap:22,lease:280,km:1.3,kmh:45,len:66}};
const DEFS=[{n:'Corner Mart',x:180,y:356,km:6,dem:3,rate:40,cap:16},{n:'Greenfields',x:110,y:400,km:14,dem:4,rate:46,cap:20},{n:'Harbour St',x:250,y:430,km:24,dem:5,rate:52,cap:24},
  {n:'Ridgeway',x:40,y:478,km:40,dem:6,rate:58,cap:30},{n:'Far Coast',x:320,y:512,km:65,dem:8,rate:72,cap:40}];
const PAY=[{n:'Budget',w:31,sp:.82},{n:'Standard',w:36,sp:1},{n:'Premium',w:43,sp:1.22}];
const DRIVER=40,HIRE=300,DOCK=6000,OVER=450,OVER_DOCK=120,LOST=15,GOAL=100000;
let G,S,speed=2,tab='team',modal=false;
const expo=m=>-Math.log(1-Math.random())*m;
const hourMul=c=>{const h=c/60;return h<9?.7:h<12?1:h<14?1.4:h<16?1:1.3};
const rate=i=>DEFS[i].dem*hourMul(S.clock)*S.dayMul*(S.promo===i?1.8:1);
function charge(k,a){G.cash-=a;S.d[k]+=a}
function say(m){$('#toast').textContent=m;S.log.unshift(clockStr()+' '+m);if(S.log.length>30)S.log.pop()}
const clockStr=()=>{const c=Math.min(1080,S.clock);return String(Math.floor(c/60)).padStart(2,'0')+':'+String(Math.floor(c%60)).padStart(2,'0')};
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{const g=JSON.parse(localStorage.getItem(KEY));if(g&&g.stores&&g.stores.length===DEFS.length)return g}catch(e){}return null}

function newGame(){G={day:1,cash:8000,fk:2,pay:1,docks:2,fleet:['rigid'],minLoad:.5,stores:DEFS.map((d,i)=>({on:i<2,stock:Math.round(d.cap*.6),sat:70})),hist:[],won:false}}
function startDay(){const dow=(G.day-1)%7;
  S={clock:360,over:false,docks:DOCK_X.map((x,i)=>({x,truck:null,on:i<G.docks})),holds:HOLD_X.map(x=>({x,truck:null})),forks:[],trucks:[],seq:0,tid:0,log:[],
    d:{rev:0,wF:0,wD:0,fuel:0,lease:0,over:0,pen:0,repair:0,other:0,km:0,deliv:0,sold:0,lost:0},promo:-1,dayMul:dow>=5?1.35:1,fUtil:0};
  G.stores.forEach((s,i)=>{s.inbound=0;s.planned=0;s.flash=0;s.next=expo(60/rate(i))});
  G.fleet.forEach(addTruck);syncForks();
  charge('lease',G.fleet.reduce((a,t)=>a+TYPES[t].lease,0));charge('over',OVER+OVER_DOCK*G.docks);
  const on=G.stores.map((s,i)=>s.on?i:-1).filter(i=>i>=0);
  if(G.day>1&&Math.random()<.3){S.promo=on[Math.floor(Math.random()*on.length)];say('Promo at '+DEFS[S.promo].n+' today: expect much heavier demand.')}
  else say(dow>=5?'Weekend: shoppers are out in force.':'Depot open. Trucks start at 6.');
  render()}
function addTruck(type){const T=TYPES[type],h=S.holds.find(h=>!h.truck)||{x:HOLD_X[S.trucks.length%5],truck:null};
  const t={id:++S.tid,type,T,x:h.x,y:HOLD_Y,a:Math.PI/2,da:Math.PI/2,state:'wait',path:[],loaded:0,reserved:0,qty:0,dock:null,hold:h,store:-1,timer:0,retire:false,sp:30,km:0};h.truck=t;S.trucks.push(t)}
function syncForks(){while(S.forks.length<G.fk){const i=S.forks.length;S.forks.push({x:28+i*22,y:118,hx:28+i*22,a:-Math.PI/2,da:-Math.PI/2,state:'idle',path:[],truck:null,carry:false,timer:0})}
  while(S.forks.length>G.fk){const f=S.forks.pop();if(f.truck)f.truck.reserved--}}

/* ---------- simulation ---------- */
function move(e,sp,dt){let d=sp*dt;while(d>0&&e.path.length){const p=e.path[0],dx=p[0]-e.x,dy=p[1]-e.y,L=Math.hypot(dx,dy);
    if(L>.01)e.a=Math.atan2(dy,dx)+(p[2]?Math.PI:0);
    if(L<=d){e.x=p[0];e.y=p[1];d-=L;e.path.shift()}else{e.x+=dx/L*d;e.y+=dy/L*d;d=0}}
  let df=e.a-e.da;df=Math.atan2(Math.sin(df),Math.cos(df));e.da+=df*Math.min(1,dt*4);return!e.path.length}
function pathLen(e){let L=0,x=e.x,y=e.y;for(const p of e.path){L+=Math.hypot(p[0]-x,p[1]-y);x=p[0];y=p[1]}return L}
function pickStore(t){let best=-1,bq=0,bc=1e9;G.stores.forEach((s,i)=>{if(!s.on)return;const d=DEFS[i],have=s.stock+s.inbound+s.planned,q=Math.min(t.T.cap,d.cap-have);
    if(q<=0||q<Math.min(G.minLoad*t.T.cap,d.cap*.7))return;const cover=have/rate(i);if(cover<bc){bc=cover;best=i;bq=q}});return best<0?null:[best,bq]}
function leg(t,i,path){const d=DEFS[i];t.path=path;t.sp=pathLen(t)/(d.km*60/t.T.kmh);charge('fuel',d.km*t.T.km);S.d.km+=d.km;t.km+=d.km}
function step(dt){S.clock+=dt;
  charge('wF',G.fk*PAY[G.pay].w/60*dt);charge('wD',S.trucks.length*DRIVER/60*dt);
  G.stores.forEach((s,i)=>{if(!s.on)return;s.flash=Math.max(0,s.flash-dt/3);s.next-=dt;while(s.next<=0){s.next+=expo(60/rate(i));
      if(s.stock>0){s.stock--;S.d.sold++;s.sat=Math.min(100,s.sat+.1)}else{s.flash=1;S.d.lost++;s.sat=Math.max(0,s.sat-.8);charge('pen',LOST)}}});
  for(const t of S.trucks){const T=t.T;
    if(t.state==='wait'){if(t.retire){if(t.hold)t.hold.truck=null;t.dead=1;continue}
      const d=S.docks.find(d=>d.on&&!d.truck);if(d){d.truck=t;t.dock=d;t.hold.truck=null;t.hold=null;t.path=[[d.x,HOLD_Y],[d.x,DOOR_Y+5+T.len/2,1]];t.state='dockIn'}}
    else if(t.state==='dockIn'){if(move(t,30,dt)){t.state='loading';t.store=-1;t.seq=S.seq++}}
    else if(t.state==='loading'){
      if(t.store<0){if(t.retire){t.dock.truck=null;t.dead=1;continue}
        const p=pickStore(t);if(p){t.store=p[0];t.qty=p[1];G.stores[p[0]].planned+=p[1]}}
      else if(t.loaded>=t.qty&&!t.reserved){const s=G.stores[t.store],d=DEFS[t.store],dx=t.dock.x;s.planned-=t.qty;s.inbound+=t.loaded;t.dock.truck=null;t.dock=null;
        leg(t,t.store,[[dx,OUT_Y],[d.x,OUT_Y],[d.x,d.y-6-T.len/2]]);t.state='out';t.breaks=Math.random()<d.km/1200}}
    else if(t.state==='out'){if(move(t,t.sp,dt)){if(t.breaks){t.breaks=false;t.state='broken';t.timer=90;charge('repair',400);say(T.n+' #'+t.id+' broke down near '+DEFS[t.store].n+'. 90 min, $400 repair.')}else{t.state='unload';t.timer=.6}}}
    else if(t.state==='broken'){t.timer-=dt;if(t.timer<=0){t.state='unload';t.timer=.6}}
    else if(t.state==='unload'){const s=G.stores[t.store],d=DEFS[t.store];t.timer-=dt;while(t.timer<=0&&t.loaded>0){t.timer+=.6;t.loaded--;s.stock++;s.inbound--;S.d.deliv++;G.cash+=d.rate;S.d.rev+=d.rate}
      if(!t.loaded){const h=S.holds.find(h=>!h.truck)||{x:HOLD_X[t.id%5],truck:null};h.truck=t;t.hold=h;leg(t,t.store,[[d.x,BACK_Y],[h.x,BACK_Y],[h.x,HOLD_Y]]);t.store=-1;t.state='back'}}
    else if(t.state==='back'){if(move(t,t.sp,dt))t.state='wait'}}
  S.trucks=S.trucks.filter(t=>!t.dead);
  const P=PAY[G.pay];let busy=0;
  for(const f of S.forks){
    if(f.state==='idle'||f.state==='home'){
      const t=S.trucks.filter(t=>t.state==='loading'&&t.store>=0&&t.loaded+t.reserved<t.qty).sort((a,b)=>a.seq-b.seq)[0];
      if(t){t.reserved++;f.truck=t;f.path=[[24+Math.random()*312,RACK_Y]];f.state='toRack'}
      else if(f.state==='home'){if(move(f,50*P.sp,dt))f.state='idle'}}
    if(f.state==='toRack'){if(move(f,50*P.sp,dt)){f.state='pick';f.timer=1/P.sp}}
    else if(f.state==='pick'){f.timer-=dt;if(f.timer<=0){f.carry=true;f.path=[[f.truck.dock.x+Math.random()*10-5,DOOR_Y-4]];f.state='toDock'}}
    else if(f.state==='toDock'){if(move(f,50*P.sp,dt)){f.state='place';f.timer=1/P.sp}}
    else if(f.state==='place'){f.timer-=dt;if(f.timer<=0){f.carry=false;f.truck.loaded++;f.truck.reserved--;f.truck=null;f.path=[[f.hx,118]];f.state='home'}}
    if(f.state!=='idle'&&f.state!=='home')busy++}
  S.fUtil+=(busy/Math.max(1,S.forks.length)-S.fUtil)*Math.min(1,dt/40);
  if(S.clock>=1080)endDay()}
const costs=d=>d.wF+d.wD+d.fuel+d.lease+d.over+d.pen+d.repair+d.other;
const nextOffer=()=>G.stores.findIndex(s=>!s.on);

function endDay(){S.over=true;const d=S.d,profit=d.rev-costs(d),avail=d.sold/Math.max(1,d.sold+d.lost);G.hist.push({day:G.day,profit,avail});
  let notes='';G.stores.forEach((s,i)=>{if(s.on&&s.sat<=0){s.on=false;s.sat=40;notes+=`<p class="neg"><b>${DEFS[i].n} cancelled its contract.</b> Shelves were empty too often.</p>`}});
  const dead=G.cash<-5000||!G.stores.some(s=>s.on),off=nextOffer(),canOffer=!dead&&off>=0&&avail>=.9;
  let win='';if(!dead&&!G.won&&G.cash>=GOAL){G.won=true;win=`<div class="offer"><b>🏆 ${money(GOAL)} in the bank.</b><p style="margin:4px 0 0">You've built a network that pays for itself. Keep going as long as you like.</p></div>`}
  const row=(a,b,c)=>`<tr${c?' class="'+c+'"':''}><td>${a}</td><td>${b}</td></tr>`;
  let h=`<h2>${dead?'The bank has pulled the plug':'Day '+G.day+' closed'}</h2><p>${dead?(G.cash<-5000?'You are more than $5,000 overdrawn.':'Every store has walked away.')+' You lasted '+G.day+' days.':'Shelves stocked '+(avail*100).toFixed(0)+'% of the time. '+d.deliv+' pallets delivered over '+Math.round(d.km)+' km.'}</p>
  <table>${row('Delivery income',money(d.rev))}${row('Warehouse wages',money(-d.wF))}${row('Driver wages',money(-d.wD))}${row('Fuel and running ('+Math.round(d.km)+' km)',money(-d.fuel))}${row('Truck leases',money(-d.lease))}${row('Depot rent',money(-d.over))}${row('Empty-shelf penalties ('+d.lost+')',money(-d.pen))}${d.repair?row('Repairs',money(-d.repair)):''}${d.other?row('Hiring and building',money(-d.other)):''}
  <tr class="tot"><td>Profit today</td><td class="${profit<0?'neg':'pos'}">${money(profit)}</td></tr>${row('Cash',money(G.cash))}${d.deliv?row('Cost per pallet delivered',money((costs(d)-d.other)/d.deliv)):''}</table>${notes}${win}`;
  if(canOffer){const o=DEFS[off];h+=`<div class="offer" id="offer"><b>New contract offer: ${o.n}</b><p style="margin:4px 0 8px">${o.km} km away · about ${o.dem} pallets an hour · pays ${money(o.rate)} a pallet. You'll likely need more trucks and hands.</p><button class="pri" data-act="accept:${off}">Accept contract</button></div>`}
  else if(!dead&&off>=0)h+=`<p style="margin-top:10px">Keep shelves stocked 90% of a day to be offered the next contract (${DEFS[off].n}).</p>`;
  G.day++;if(dead){try{localStorage.removeItem(KEY)}catch(e){}h+=`<button class="pri go" data-act="new">Start again</button>`}else{save();h+=`<button class="pri go" data-act="next">Start day ${G.day}</button>`}
  showModal(h)}
function showModal(h){$('#mbox').innerHTML=h;$('#modal').classList.add('show');$('#modal').scrollTop=0;modal=true}
function hideModal(){$('#modal').classList.remove('show');modal=false}

/* ---------- drawing ---------- */
function rr(x,a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function pallet(x,a,b,s){x.fillStyle='#c79a5b';x.fillRect(a-s/2,b-s/2,s,s);x.strokeStyle='#7d5526';x.lineWidth=.5;x.strokeRect(a-s/2,b-s/2,s,s)}
const SIGN=['#1f5fa8','#1e8e4e','#b3541e','#6a3fa0','#0f7c86'];
function ground(x,roadTop,roadBot){x.fillStyle='#6d8a55';x.fillRect(0,0,W,H);x.fillStyle='#a9aaa5';x.fillRect(0,0,W,roadTop);x.fillStyle='#3d4045';x.fillRect(0,roadTop,W,roadBot-roadTop)}
function roadLines(x,roadTop,roadBot){x.strokeStyle='#f2f2ee';x.lineWidth=1.2;x.setLineDash([9,8]);x.beginPath();x.moveTo(0,(roadTop+roadBot)/2);x.lineTo(W,(roadTop+roadBot)/2);x.stroke();x.setLineDash([]);
  x.lineWidth=.8;x.globalAlpha=.7;x.beginPath();x.moveTo(0,roadTop+1.5);x.lineTo(W,roadTop+1.5);x.stroke();x.globalAlpha=1}
function depot(x,label){x.fillStyle='rgba(0,0,0,.18)';x.fillRect(11,11,W-16,DOOR_Y-6);x.fillStyle='#dcd9d0';x.fillRect(8,8,W-16,DOOR_Y-6);x.strokeStyle='#4b4e52';x.lineWidth=3;x.strokeRect(8,8,W-16,DOOR_Y-6);
  x.strokeStyle='#f5c400';x.lineWidth=1.5;x.setLineDash([10,6]);x.beginPath();x.moveTo(14,DOOR_Y-22);x.lineTo(W-14,DOOR_Y-22);x.stroke();x.setLineDash([]);
  x.fillStyle='#2f5d9e';x.fillRect(20,13,W-40,22);x.fillStyle='#e8731c';x.fillRect(20,23.2,W-40,1.6);for(let i=0;i<26;i++){pallet(x,28+i*12.2,18.5,7);pallet(x,28+i*12.2,29.5,7)}
  x.fillStyle='#4b4e52';x.font='700 10px '+FONT;x.textAlign='right';x.fillText(label,W-16,DOOR_Y-28);x.textAlign='left'}
function door(x,dx,open,active){if(!open){x.strokeStyle='#8d8f8b';x.lineWidth=1;x.setLineDash([3,3]);x.strokeRect(dx-14,DOOR_Y+3,28,74);x.setLineDash([]);return}
  x.strokeStyle='#f5c400';x.lineWidth=1.4;x.strokeRect(dx-14,DOOR_Y+3,28,74);x.fillStyle='#26282b';x.fillRect(dx-12,DOOR_Y-3,24,6);
  x.fillStyle=active?'#27c267':'#c8281e';x.beginPath();x.arc(dx+17,DOOR_Y-7,2.4,0,7);x.fill()}
function bay(x,hx,y,h){x.strokeStyle='#f2f2ee';x.lineWidth=1;x.setLineDash([4,4]);x.strokeRect(hx-14,y,28,h);x.setLineDash([]);x.fillStyle='rgba(242,242,238,.7)';x.font='700 8px '+FONT;x.fillText('P',hx-3,y+10)}
function truckBody(x,L,cab,loaded,cap,broken){const tl=L-13;x.fillStyle='rgba(0,0,0,.28)';x.fillRect(-L/2+2,-8,L,20);
  x.fillStyle=broken?'#f0c9c4':'#f7f7f4';rr(x,-L/2,-10,tl,20,2);x.strokeStyle='#55585c';x.lineWidth=.8;x.beginPath();x.roundRect(-L/2,-10,tl,20,2);x.stroke();
  x.fillStyle=cab;rr(x,L/2-12,-9,12,18,3);x.fillStyle='#1d1f21';x.fillRect(L/2-5,-7,3,14);
  const cols=Math.ceil(cap/2),sz=Math.min(8,(tl-3)/cols-.6);for(let i=0;i<loaded;i++)pallet(x,-L/2+2+sz/2+Math.floor(i/2)*(sz+.6),(i%2?4.5:-4.5),sz)}
function forklift(x,f){x.save();x.translate(f.x,f.y);x.rotate(f.da);x.fillStyle='rgba(0,0,0,.25)';x.fillRect(-5,-3.5,10,9);x.fillStyle='#f5a300';rr(x,-6,-4.5,10,9,2);x.fillStyle='#1d1f21';x.fillRect(-3,-3,4,6);
  x.strokeStyle='#33363a';x.lineWidth=1.2;x.beginPath();x.moveTo(4,-2.5);x.lineTo(10,-2.5);x.moveTo(4,2.5);x.lineTo(10,2.5);x.stroke();if(f.carry)pallet(x,9,0,7);x.restore()}
function storeBox(x,bx,by,bw,bh,name,col,empty,promo){x.fillStyle='rgba(0,0,0,.22)';x.fillRect(bx+3,by+3,bw,bh);x.fillStyle='#f1eee6';x.fillRect(bx,by,bw,bh);
  x.fillStyle=empty?'#c8281e':col;x.fillRect(bx,by,bw,13);x.strokeStyle=promo?'#ffd200':'#4b4e52';x.lineWidth=promo?2.5:1.2;x.strokeRect(bx,by,bw,bh);
  x.fillStyle='#fff';x.font='700 9px '+FONT;x.fillText(name,bx+5,by+10)}
function setup(){const c=$('#c'),r=c.getBoundingClientRect(),dp=Math.min(window.devicePixelRatio||1,2),cw=Math.round(r.width*dp),ch=Math.round(r.height*dp);
  if(c.width!==cw||c.height!==ch){c.width=cw;c.height=ch}const x=c.getContext('2d'),s=cw/W;x.setTransform(s,0,0,s,0,0);return x}
const FONT='"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif';
function draw(){const x=setup();ground(x,OUT_Y-12,BACK_Y+12);
  x.fillStyle='#3d4045';G.stores.forEach((st,i)=>{if(st.on)x.fillRect(DEFS[i].x-13,BACK_Y,26,DEFS[i].y-BACK_Y)});roadLines(x,OUT_Y-12,BACK_Y+12);
  for(const h of S.holds)bay(x,h.x,HOLD_Y-36,70);
  depot(x,'DEPOT');for(const d of S.docks)door(x,d.x,d.on,d.truck&&d.truck.state==='loading'&&d.truck.store>=0);
  G.stores.forEach((st,i)=>{const d=DEFS[i],bx=d.x-33;if(!st.on){x.strokeStyle='#dfe8d4';x.globalAlpha=.6;x.lineWidth=1;x.setLineDash([4,4]);x.strokeRect(bx,d.y,66,42);x.setLineDash([]);x.fillStyle='#fff';x.font='8px '+FONT;x.fillText('NO CONTRACT',bx+10,d.y+24);x.globalAlpha=1;return}
    const empty=st.stock===0;storeBox(x,bx,d.y,66,42,d.n,SIGN[i],empty,S.promo===i);
    x.fillStyle='#5c6066';x.font='8px '+FONT;x.fillText(d.km+' km'+(S.promo===i?' · PROMO':''),bx+5,d.y+24);
    x.fillStyle=empty?'#c8281e':'#1d1f21';x.textAlign='right';x.font='700 8.5px '+FONT;x.fillText(empty?'EMPTY':st.stock+'/'+d.cap,bx+61,d.y+24);x.textAlign='left';
    x.fillStyle='#cfccc3';x.fillRect(bx+5,d.y+29,56,7);x.fillStyle=st.stock<d.cap*.25?'#f5a300':'#b9803f';x.fillRect(bx+5,d.y+29,56*Math.min(1,st.stock/d.cap),7);
    if(st.flash>0){x.globalAlpha=st.flash;x.fillStyle='#c8281e';x.beginPath();x.arc(bx+66,d.y,7,0,7);x.fill();x.fillStyle='#fff';x.font='700 9px '+FONT;x.fillText('✕',bx+62.5,d.y+3);x.globalAlpha=1}});
  for(const t of S.trucks){x.save();x.translate(t.x,t.y);x.rotate(t.da);x.globalAlpha=t.retire?.5:1;truckBody(x,t.T.len,t.type==='semi'?'#c8281e':t.type==='van'?'#f5c400':'#1f5fa8',t.loaded,t.T.cap,t.state==='broken');x.restore();
    if(t.state==='broken'){x.fillStyle='#c8281e';x.font='700 11px '+FONT;x.fillText('⚠',t.x+13,t.y+3)}}
  for(const f of S.forks)forklift(x,f)}

/* ---------- interface ---------- */
function tStatus(t){const s=t.store>=0?DEFS[t.store].n:'';return t.retire?'Being returned':{wait:'Waiting for a dock',dockIn:'Backing in',loading:t.store<0?'At dock, no store needs a load yet':`Loading for ${s} ${t.loaded}/${t.qty}`,out:'Driving to '+s,broken:'Broken down',unload:'Unloading at '+s,back:'Heading back'}[t.state]}
function advice(){const empty=G.stores.some(s=>s.on&&s.stock===0),wait=S.trucks.filter(t=>t.state==='wait').length,atDepot=S.trucks.filter(t=>t.state==='wait'||t.state==='loading'||t.state==='dockIn').length,
  idleDock=S.trucks.some(t=>t.state==='loading'&&t.store<0);let m,c='var(--good)';
  if(empty&&S.fUtil>.88&&atDepot){m='Forklifts are flat out and shelves are empty. Hire an operator or raise pay.';c='var(--bad)'}
  else if(empty&&!atDepot){m='Shelves are empty and every truck is on the road. You need more truck capacity.';c='var(--bad)'}
  else if(empty&&wait&&!idleDock){m='Trucks are queuing for a dock while shelves sit empty.';c='var(--bad)'}
  else if(empty){m='A store has run out. Each empty-shelf sale costs '+money(LOST)+' and goodwill.';c='var(--bad)'}
  else if(S.fUtil<.3&&G.fk>1&&S.clock>480){m='Operators are standing around. Idle hands still get paid.';c='#f5a300'}
  else m='Running smoothly.';
  $('#advice').textContent=m;$('#advice').style.borderLeftColor=c}
const seg=(act,opts,cur)=>`<div class="seg">${opts.map(o=>`<button data-act="${act}:${o[0]}" class="${o[0]===cur?'on':''}">${o[1]}</button>`).join('')}</div>`;
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.act==='tab:'+tab));
  document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',b.dataset.act==='speed:'+speed));
  let h='';
  if(tab==='team'){h=`<h3>Forklift operators</h3><p>Each loads about ${(7.5*PAY[G.pay].sp).toFixed(0)} pallets an hour. Paid all day, busy or not.</p>
    <div class="rowx"><div class="t"><b>${G.fk} on shift</b><span>Busy <span data-v="futil"></span> of the time</span></div><div style="display:flex;gap:6px"><button data-act="fire" ${G.fk<=1?'disabled':''}>−</button><button data-act="hire" ${G.fk>=8?'disabled':''}>Hire ${money(HIRE)}</button></div></div>
    <h3>Warehouse pay</h3>${seg('pay',PAY.map((p,i)=>[i,`${p.n}<small>$${p.w}/h · ${p.sp<1?'slower':p.sp>1?'faster':'normal'}</small>`]),G.pay)}
    <h3>Loading docks</h3><div class="rowx"><div class="t"><b>${G.docks} of 4 open</b><span>Each adds ${money(OVER_DOCK)} a day in rent</span></div><button data-act="dock" ${G.docks>=4?'disabled':''}>Build ${money(DOCK)}</button></div>
    <h3>Wage bill</h3><p>${money(G.fk*PAY[G.pay].w+G.fleet.length*DRIVER)} an hour (${G.fk} operators, ${G.fleet.length} driver${G.fleet.length>1?'s':''} at $${DRIVER}/h).</p>`}
  else if(tab==='fleet'){h=`<h3>Send a truck when it can carry at least</h3>${seg('min',[[.25,'¼ load'],[.5,'½ load'],[.75,'¾ load'],[1,'Full']],G.minLoad)}
    <p style="margin-top:6px">Small loads keep shelves full but burn kilometres. Full loads are cheap per pallet but stores wait.</p><h3>Your trucks</h3>`+
    (S.trucks.map(t=>`<div class="rowx"><div class="t"><b>${t.T.n} #${t.id}</b><span data-v="t${t.id}"></span></div><button data-act="ret:${t.id}" ${t.retire||G.fleet.length<=1?'disabled':''}>Return</button></div>`).join('')||'<p>None.</p>')+
    `<h3>Lease another</h3><p>Lease is charged per day, starting now. Each truck comes with a driver at $${DRIVER}/h.</p>`+
    Object.entries(TYPES).map(([k,T])=>`<div class="rowx"><div class="t"><b>${T.n} · ${T.cap} pallets</b><span>${money(T.lease)}/day · $${T.km.toFixed(2)}/km · ${T.kmh} km/h</span></div><button data-act="lease:${k}" ${G.fleet.length>=8?'disabled':''}>Lease</button></div>`).join('')}
  else if(tab==='stores'){h='<h3>Contracts</h3>'+G.stores.map((s,i)=>{const d=DEFS[i];return s.on?`<div class="rowx"><div class="t"><b>${d.n}${S.promo===i?'<span class="tag">PROMO</span>':''}</b><span>${d.km} km · ${money(d.rate)}/pallet · wants <span data-v="r${i}"></span>/h<br>Stock <span data-v="s${i}"></span> · Goodwill <span data-v="g${i}"></span></span></div><div class="meter"><i data-w="g${i}"></i></div></div>`:''}).join('');
    const o=nextOffer();h+=o>=0?`<p style="margin-top:10px">Next contract: <b style="color:var(--ink)">${DEFS[o].n}</b>, ${DEFS[o].km} km, ${money(DEFS[o].rate)}/pallet. Offered after a day with shelves stocked 90%+.</p>`:'<p style="margin-top:10px">You hold every contract in the region.</p>';
    h+=`<p>Goodwill rises with every sale and drops with every empty-shelf visit. At zero, the store cancels.</p>`}
  else{h=`<h3>Today so far</h3><table><tr><td>Delivery income</td><td data-v="lrev"></td></tr><tr><td>Wages</td><td data-v="lwage"></td></tr><tr><td>Fuel and running</td><td data-v="lfuel"></td></tr><tr><td>Leases and rent</td><td data-v="lfix"></td></tr><tr><td>Penalties and repairs</td><td data-v="lpen"></td></tr>
    <tr class="tot"><td>Profit</td><td data-v="lprof"></td></tr><tr><td>Kilometres driven</td><td data-v="lkm"></td></tr><tr><td>Pallets delivered</td><td data-v="ldel"></td></tr><tr><td>Cost per pallet</td><td data-v="lcpp"></td></tr><tr><td>Shelves stocked</td><td data-v="lav"></td></tr></table>
    <h3>Past days</h3>`+(G.hist.length?'<table>'+G.hist.slice(-7).reverse().map(x=>`<tr><td>Day ${x.day} · ${(x.avail*100).toFixed(0)}% stocked</td><td class="${x.profit<0?'neg':'pos'}">${money(x.profit)}</td></tr>`).join('')+'</table>':'<p>Nothing yet.</p>')+
    `<h3>Goal</h3><p>Reach ${money(GOAL)} cash. Go more than $5,000 overdrawn at close and the bank shuts you down.</p><h3>Log</h3><p data-v="log" style="white-space:pre-line"></p><button data-act="restart" style="margin-top:6px">Start a new game</button>`}
  $('#panel').innerHTML=h;live()}
function live(){const d=S.d,pr=d.rev-costs(d),v={futil:(S.fUtil*100).toFixed(0)+'%',lrev:money(d.rev),lwage:money(-d.wF-d.wD),lfuel:money(-d.fuel),lfix:money(-d.lease-d.over),lpen:money(-d.pen-d.repair),lprof:money(pr),lkm:Math.round(d.km)+' km',ldel:d.deliv,
    lcpp:d.deliv?money((costs(d)-d.other)/d.deliv):'–',lav:(d.sold/Math.max(1,d.sold+d.lost)*100).toFixed(0)+'%',log:S.log.slice(0,8).join('\n')};
  S.trucks.forEach(t=>v['t'+t.id]=tStatus(t)+' · '+Math.round(t.km)+' km today');
  G.stores.forEach((s,i)=>{if(s.on){v['r'+i]=rate(i).toFixed(1);v['s'+i]=s.stock+'/'+DEFS[i].cap;v['g'+i]=Math.round(s.sat)}});
  document.querySelectorAll('[data-v]').forEach(e=>{const t=v[e.dataset.v];if(t!==undefined&&e.textContent!==String(t))e.textContent=t});
  document.querySelectorAll('[data-w]').forEach(e=>{const g=+v[e.dataset.w];e.style.width=g+'%';e.style.background=g>60?'var(--good)':g>30?'#f5a300':'var(--bad)'});
  $('#hDay').textContent='Day '+G.day0+' · '+DAYS[(G.day0-1)%7];$('#hTime').textContent=clockStr();$('#hCash').textContent=money(G.cash);$('#hCash').className=G.cash<0?'neg':'';
  $('#hToday').textContent=(pr>0?'+':'')+money(pr);$('#hToday').className=pr<0?'neg':'pos';advice()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const[a,p]=b.dataset.act.split(':');
  if(a==='tab')tab=p;else if(a==='speed')speed=+p;
  else if(a==='hire'){G.fk++;charge('other',HIRE);syncForks()}else if(a==='fire'){G.fk--;syncForks()}
  else if(a==='pay')G.pay=+p;else if(a==='min')G.minLoad=+p;
  else if(a==='dock'){if(G.cash<DOCK){say('Not enough cash to build a dock.');return}S.docks[G.docks].on=true;G.docks++;charge('other',DOCK);say('New dock open.')}
  else if(a==='lease'){G.fleet.push(p);addTruck(p);charge('lease',TYPES[p].lease);say(TYPES[p].n+' leased.')}
  else if(a==='ret'){const t=S.trucks.find(t=>t.id==p);if(t){t.retire=true;G.fleet.splice(G.fleet.indexOf(t.type),1)}}
  else if(a==='accept'){G.stores[p].on=true;G.stores[p].stock=Math.round(DEFS[p].cap*.5);G.stores[p].sat=70;save();$('#offer').innerHTML='<b class="pos">Contract signed: '+DEFS[p].n+'</b>';return}
  else if(a==='next'){hideModal();begin()}
  else if(a==='new'){newGame();hideModal();begin()}
  else if(a==='restart'){if(confirm('Start a new game? Your current depot will be lost.')){newGame();begin()}}
  else if(a==='continue'){hideModal()}
  render()});
function begin(){G.day0=G.day;startDay()}

G=load();const resumed=!!G;if(!G)newGame();begin();
showModal(`<h2>Pallet Flow: Depot Manager</h2><p>You run a depot. Stores pay you for every pallet you deliver, and fine you for every shopper who finds an empty shelf.</p>
<ul><li><b>Depot:</b> hire forklift operators, set their pay, build docks.</li><li><b>Fleet:</b> lease vans, rigids or semis. Every kilometre costs fuel, every hour costs wages.</li><li><b>Stores:</b> keep shelves 90% stocked to win further, better-paying contracts.</li><li><b>Ledger:</b> watch cost per pallet. That number is the game.</li></ul>
<p>Days run 6am to 6pm. Lunch and late afternoon are busy. Weekends are busier. Reach ${money(GOAL)} to win. Your progress saves each night.</p>
<button class="pri go" data-act="${resumed?'continue':'new'}">${resumed?'Continue day '+G.day:'Open the depot'}</button>${resumed?'<button class="go" data-act="new">New game</button>':''}`);
let last=performance.now(),acc=0,uiT=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!modal&&!S.over&&speed){acc+=dt*speed*2;let n=0;while(acc>.1&&n<40&&!S.over){step(.1);acc-=.1;n++}if(n===40)acc=0}
  draw();uiT+=dt;if(uiT>.35){uiT=0;if(!S.over)live()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
