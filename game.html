<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pallet Flow: Depot Manager</title>
<meta name="description" content="Run a distribution depot. Hire forklift operators, lease trucks, win store contracts, and stay in profit.">
<style>
:root{--bg:#e6e4de;--card:#fbfaf7;--deep:#efede7;--line:#cbc8bf;--ink:#1d1f21;--dim:#5c6066;--acc:#ffd200;--good:#1e8e4e;--bad:#c8281e;--blue:#1f5fa8;--sign:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.hud{position:sticky;top:0;z-index:5;background:#1d1f21;margin-bottom:6px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:repeating-linear-gradient(-45deg,#ffd200 0 10px,#1d1f21 10px 20px)}
.hud .pos{color:#5fd38a!important}.hud .neg{color:#ff7466!important}
.hud div{min-width:0}.hud small{display:block;color:#b9bcc0;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.hud b{color:#ffd200;font-family:var(--sign);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
main{max-width:980px;margin:0 auto;padding:12px 12px 60px;display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:820px){main{grid-template-columns:minmax(0,430px) 1fr;align-items:start}}
canvas{display:block;width:100%;aspect-ratio:360/440;touch-action:none;cursor:grab;border-radius:6px;background:#6d8a55;border:2px solid #1d1f21}
.bar{display:flex;gap:6px;margin-bottom:8px}
button{background:#fff;color:var(--ink);border:1.5px solid #1d1f21;font:inherit;font-weight:600;padding:8px 12px;border-radius:6px;cursor:pointer;min-height:42px}
button.on{background:#1d1f21;border-color:#1d1f21;color:#ffd200;font-weight:700}
button.pri{background:var(--acc);border-color:#1d1f21;color:#1d1f21;font-weight:700}
button:disabled{opacity:.4}
.bar button{flex:1;padding:8px 4px}
.advice{background:#fff;border:1px solid var(--line);border-left:6px solid var(--good);border-radius:6px;font-weight:600;padding:9px 12px;font-size:14px;margin-bottom:8px;min-height:42px}
.toast{font-size:13px;color:var(--dim);min-height:20px;margin-bottom:8px}
.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button{flex:1;padding:8px 2px;font-family:var(--sign);font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.panel{background:var(--card);border:1px solid var(--line);border-top:4px solid #1d1f21;border-radius:6px;padding:14px}
h3{margin:0 0 4px;font-family:var(--sign);font-size:19px;text-transform:uppercase;letter-spacing:.03em}h3:not(:first-child){margin-top:16px}
p{margin:0 0 8px;color:var(--dim);font-size:14px}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.rowx:first-of-type{border-top:0}
.rowx .t{min-width:0}.rowx .t b{display:block}.rowx .t span{color:var(--dim);font-size:13px}
.rowx button{flex:none}
.seg{display:flex;gap:4px}.seg button{flex:1;padding:6px 2px;font-size:13px;line-height:1.25}
.seg small{display:block;color:inherit;opacity:.75;font-size:11px}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 0;border-top:1px solid var(--line);color:var(--dim)}
td:last-child{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}tr.tot td{color:var(--ink);font-weight:700;border-top:2px solid var(--line)}
.pos{color:var(--good)!important}.neg{color:var(--bad)!important}
.meter{height:8px;background:#d9d6ce;border-radius:4px;overflow:hidden;margin-top:4px;width:120px}.meter i{display:block;height:100%;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.8);z-index:10;display:none;align-items:flex-start;justify-content:center;padding:20px 14px;overflow:auto}
.modal.show{display:flex}
.box{background:var(--card);border:2px solid #1d1f21;border-top:10px solid #ffd200;border-radius:8px;padding:20px;max-width:460px;width:100%;margin:auto}
.box h2{margin:0 0 6px;font-family:var(--sign);font-size:30px;line-height:1.05;text-transform:uppercase}
.box ul{margin:6px 0 12px;padding-left:18px;color:var(--dim);font-size:14px}.box li{margin-bottom:4px}.box li b{color:var(--ink)}
.offer{background:#fff6c9;border:1.5px solid #1d1f21;border-radius:6px;padding:12px;margin:12px 0}
.box .go{width:100%;margin-top:10px;font-size:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:#1d1f21;color:#ffd200;margin-left:4px}
.fkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.fkgrid label{font-size:13px;color:var(--dim)}.fkgrid select{display:block;width:100%;font:inherit;padding:8px;border:1.5px solid #1d1f21;border-radius:6px;background:#fff;color:var(--ink);min-height:40px}
.map{position:relative}.mapbtn{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}.mapbtn button{min-height:36px;padding:4px 10px;font-size:13px;background:rgba(255,255,255,.92)}
a{color:var(--blue)}
ul.cond,.box ul{list-style:none;padding:0;margin:4px 0 10px;font-size:14px;color:var(--ink)}ul.cond li,.box h3+ul li{padding:3px 0}
.truck{border-top:1px solid var(--line);padding-bottom:8px}.truck .rowx{border:0;padding-bottom:4px}.trow{display:flex;gap:6px}.trow select{flex:1;min-width:0;font:inherit;padding:8px;border:1.5px solid #1d1f21;border-radius:6px;background:#fff;color:var(--ink);min-height:42px}.trow button{padding:8px 9px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:3px;height:60px;margin:6px 0 8px}.bars i{flex:1;border-radius:2px 2px 0 0;max-width:22px}
.box h3{font-family:var(--sign);text-transform:uppercase;font-size:19px;margin:0}
</style>
</head>
<body>
<div class="hud">
  <div><small id="hDay">Day 1</small><b id="hTime">06:00</b></div>
  <div><small>Cash</small><b id="hCash">$0</b></div>
  <div><small>Today</small><b id="hToday">$0</b></div>
</div>
<main>
  <div class="map"><canvas id="c"></canvas><div class="mapbtn"><button data-act="view:depot">Depot</button><button data-act="view:map">Map</button><button data-act="zoom:1.35">+</button><button data-act="zoom:.74">−</button></div></div>
  <div>
    <div class="bar" id="speed">
      <button data-act="speed:0">❚❚</button><button data-act="speed:1">1×</button><button data-act="speed:2">2×</button><button data-act="speed:4">4×</button><button data-act="speed:8">8×</button>
    </div>
    <div class="advice" id="advice">Good morning.</div>
    <div class="toast" id="toast"></div>
    <div class="tabs" id="tabs">
      <button data-act="tab:team">Depot</button><button data-act="tab:fleet">Fleet</button><button data-act="tab:stores">Stores</button><button data-act="tab:invest">Invest</button><button data-act="tab:ledger">Ledger</button>
    </div>
    <div class="panel" id="panel"></div>
    <p style="margin-top:12px;font-size:13px"><a href="./">← Back to the simple simulation</a></p>
  </div>
</main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>

<script>
const $=s=>document.querySelector(s),money=n=>(n<0?'−$':'$')+Math.abs(Math.round(n)).toLocaleString('en-AU');
const WW=760,WH=1000,OX=120,DW=520,DOOR_Y=150,HOLD_Y=260,OUT_Y=304,BACK_Y=320,RACK_Y=44,TRUNK=380,CROSS=[312,560,800],DOCK_X=[60,140,220,300,380,460].map(v=>v+OX),HOLD_X=[20,100,180,260,340,420,500].map(v=>v+OX),NH=HOLD_X.length;
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],KEY='palletflow-game-v3';
const FONT='"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif';
const TYPES={van:{n:'Van',cap:4,lease:90,l:10,run:.16,kmh:55,len:30,svc:250},rigid:{n:'Rigid',cap:10,lease:160,l:22,run:.34,kmh:50,len:44,svc:400},semi:{n:'Semi',cap:22,lease:280,l:38,run:.6,kmh:45,len:66,svc:650},sup:{n:'Supplier',cap:26,len:66}};
const DEFS=[['Corner Mart',0,90,6,3,46,16],['Greenfields',0,670,12,4,52,20],['Harbour St',1,200,22,5,56,24],['Ridgeway',1,560,30,5,58,26],['Lakeside',1,60,36,5,60,26],
  ['Far Coast',1,700,44,6,64,30],['Millbrook',2,250,52,6,68,32],['Port Albany',2,520,60,7,72,36],['Summit',2,80,70,6,78,32],['Kingsford Hub',2,690,80,8,84,44]].map(a=>({n:a[0],st:a[1],x:a[2],y:CROSS[a[1]]+70,km:a[3],dem:a[4],rate:a[5],cap:a[6]}));
const PAY=[{n:'Budget',w:31,sp:.82},{n:'Standard',w:36,sp:1},{n:'Premium',w:43,sp:1.22}];
const UPS={lev:['Dock levellers',4000,'Forklifts work 40% quicker at the dock door.'],rack:['Extra racking',5000,'The depot holds 100 more pallets. Can be bought 4 times.'],tank:['Bigger fuel tank',4000,'The depot tank holds 8,000 L instead of 2,000 L.'],route:['Route planning software',6000,'Every trip is 12% shorter: less time, less fuel.'],
  train:['Driver training',3500,'Half as many breakdowns.'],back:['Store back rooms',8000,'Every store can hold 25% more stock.'],mess:['Break room and canteen',2500,'Crew morale recovers faster.']};
const TIERS=[[25000,'Bronze'],[100000,'Silver'],[250000,'Gold']];
const DRIVER=40,HIRE=300,DOCK=6000,OVER=450,OVER_DOCK=120,LOST=15,STOR=1.2,RUSH=250,LOAD=26,LOAN_STEP=5000,LOAN_MAX=40000,LOAN_RATE=.008,SUPW=48,MAXORD=900;
let G,S,speed=0,tab='team',modal=false;
const expo=m=>-Math.log(1-Math.random())*m;
const hourMul=c=>{const h=c/60;return h<9?.7:h<12?1:h<14?1.4:h<16?1:1.3};
const cap=i=>Math.round(DEFS[i].cap*(G.up.back?1.25:1)),whCap=()=>200+100*(G.up.rack||0),tankCap=()=>G.up.tank?8000:2000,price=()=>1.85*G.cond.fuel,perKm=T=>T.l/100*price()+T.run,eff=()=>{const n=S.forks.length;return G.sup.wh?1.1:n>4?Math.max(.6,1-.07*(n-4)):1},kmOf=i=>DEFS[i].km*(G.up.route?.88:1);
const rate=i=>DEFS[i].dem*hourMul(S.clock)*S.dayMul*(G.cond.promo===i?1.8:1)*(G.cond.wx==='rain'?.9:G.cond.wx==='heat'?1.25:1);
const mm=()=>.9+.2*G.morale/100;
function charge(k,a){G.cash-=a;S.d[k]+=a}
function say(m){$('#toast').textContent=m;S.log.unshift(clockStr()+' '+m);if(S.log.length>30)S.log.pop()}
const clockStr=()=>{const c=Math.min(1080,S.clock);return String(Math.floor(c/60)).padStart(2,'0')+':'+String(Math.floor(c%60)).padStart(2,'0')};
function save(){try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}}
function load(){try{const g=JSON.parse(localStorage.getItem(KEY));if(g&&g.stores&&g.stores.length===DEFS.length&&g.cond&&g.sup)return g}catch(e){}return null}
const onStores=()=>G.stores.map((s,i)=>s.on?i:-1).filter(i=>i>=0);
function genCond(prev){const r=Math.random(),on=onStores(),pick=()=>on[Math.floor(Math.random()*on.length)];
  return{wx:r<.18?'rain':r<.26?'heat':'fine',promo:Math.random()<.3?pick():-1,road:Math.random()<.14?pick():-1,fuel:Math.max(.75,Math.min(1.6,prev.fuel+(Math.random()-.5)*.14+(1-prev.fuel)*.08+(Math.random()<.07?.25:0)))}}
function condList(c,day){const a=[],dow=(day-1)%7;a.push(c.wx==='rain'?'🌧 Rain: trucks 25% slower, slightly fewer shoppers':c.wx==='heat'?'☀️ Heatwave: 25% more shoppers':'⛅ Fine weather');
  if(dow>=5)a.push('🛒 Weekend: 35% more shoppers');if(c.promo>=0)a.push('📣 Promo at '+DEFS[c.promo].n+': demand up 80%');if(c.road>=0)a.push('🚧 Roadworks on the '+DEFS[c.road].n+' run: 40% longer');
  const y=G.fuelHist[G.fuelHist.length-2];a.push('⛽ Diesel $'+(1.85*c.fuel).toFixed(2)+'/L'+(y?(c.fuel>y+.005?' ▲ up from $':c.fuel<y-.005?' ▼ down from $':' — same as $')+(1.85*y).toFixed(2):''));return a}

function newGame(){G={day:1,cash:8000,loan:0,fk:3,pay:1,morale:70,docks:2,fleet:[{id:1,type:'rigid',cond:100,route:-1}],nid:2,minLoad:.5,wh:120,order:90,up:{},sup:{wh:false,tr:false},tank:500,inMode:'spread',fkMode:'auto',fkPri:'bal',fkDock:[],fuelHist:[1],
  stores:DEFS.map((d,i)=>({on:i<2,stock:Math.round(d.cap*.6),sat:70})),hist:[],tier:0,cond:{wx:'fine',promo:-1,road:-1,fuel:1}}}
function startDay(){const dow=(G.day-1)%7;
  S={clock:360,over:false,docks:DOCK_X.map((x,i)=>({x,truck:null,on:i<G.docks})),holds:HOLD_X.map(x=>({x,truck:null})),forks:[],trucks:[],seq:0,log:[],
    d:{rev:0,wF:0,wD:0,fuel:0,lease:0,over:0,pen:0,repair:0,other:0,stor:0,int:0,det:0,km:0,deliv:0,sold:0,lost:0,recv:0,litres:0},dayMul:dow>=5?1.35:1,fUtil:0,busyT:0,totT:0,ordered:0,slot:0,whRes:0,whIn:0,sick:0};
  for(let i=0;i<G.fk;i++)if(G.morale<60&&Math.random()<(60-G.morale)/200*(G.sup.wh?.5:1))S.sick++;S.sick=Math.min(S.sick,G.fk-1);
  G.stores.forEach((s,i)=>{s.inbound=0;s.planned=0;s.flash=0;s.next=expo(60/rate(i))});
  G.fleet.forEach(o=>{if(o.route>=0&&!G.stores[o.route].on)o.route=-1;addTruck(o)});syncForks();
  charge('lease',G.fleet.reduce((a,o)=>a+TYPES[o.type].lease,0));charge('over',OVER+OVER_DOCK*G.docks);if(G.loan)charge('int',G.loan*LOAN_RATE);
  say(S.sick?S.sick+' operator'+(S.sick>1?'s':'')+' called in sick. Morale is low.':'Gates closed. Check today, then press a speed to open.');
  render()}
function addTruck(o,qty){const T=TYPES[o.type],h=S.holds.find(h=>!h.truck)||{x:HOLD_X[S.trucks.length%NH],truck:null};
  const t={o,id:o.id,type:o.type,T,x:h.x,y:HOLD_Y,a:Math.PI/2,da:Math.PI/2,state:'wait',path:[],loaded:0,reserved:0,qty:0,dock:null,hold:h,store:-1,timer:0,retire:false,sp:30,km:0,site:0};h.truck=t;
  if(o.type==='sup'){t.inb=true;t.loaded=qty;t.x=-40;t.y=BACK_Y;t.a=t.da=0;t.path=[[h.x,BACK_Y],[h.x,HOLD_Y]];t.state='back'}S.trucks.push(t)}
function supplier(q){addTruck({id:'in',type:'sup'},q)}
function dropJob(f){const t=f.truck;if(!t)return;if(f.job==='out'){if(f.carry){G.wh++;t.reserved--}else{t.reserved--;S.whRes--}}else{S.whIn--;if(f.carry)G.wh++;else t.reserved--}f.truck=null}
function syncForks(){const n=Math.max(1,G.fk-S.sick);while(S.forks.length<n){const i=S.forks.length;S.forks.push({i,x:OX+28+i*22,y:118,hx:OX+28+i*22,a:-Math.PI/2,da:-Math.PI/2,state:'idle',path:[],truck:null,carry:false,timer:0})}
  while(S.forks.length>n)dropJob(S.forks.pop())}

/* ---------- simulation ---------- */
function move(e,sp,dt){let d=sp*dt;while(d>0&&e.path.length){const p=e.path[0],dx=p[0]-e.x,dy=p[1]-e.y,L=Math.hypot(dx,dy);
    if(L>.01)e.a=Math.atan2(dy,dx)+(p[2]?Math.PI:0);
    if(L<=d){e.x=p[0];e.y=p[1];d-=L;e.path.shift()}else{e.x+=dx/L*d;e.y+=dy/L*d;d=0}}
  let df=e.a-e.da;df=Math.atan2(Math.sin(df),Math.cos(df));e.da+=df*Math.min(1,dt*4);return!e.path.length}
function pathLen(e){let L=0,x=e.x,y=e.y;for(const p of e.path){L+=Math.hypot(p[0]-x,p[1]-y);x=p[0];y=p[1]}return L}
function pickStore(t){let best=-1,bq=0,bc=1e9;G.stores.forEach((s,i)=>{if(!s.on||(t.o.route>=0&&t.o.route!==i))return;const c=cap(i),have=s.stock+s.inbound+s.planned,q=Math.min(t.T.cap,c-have);
    if(q<=0||q<Math.min(G.minLoad*t.T.cap,c*.7))return;const cover=have/rate(i);if(cover<bc){bc=cover;best=i;bq=q}});return best<0?null:[best,bq]}
function outPath(dx,i,len){const d=DEFS[i],stop=[d.x,d.y-6-len/2],cy=CROSS[d.st];return d.st?[[dx,OUT_Y],[TRUNK-8,OUT_Y],[TRUNK-8,cy-8],[d.x,cy-8],stop]:[[dx,OUT_Y],[d.x,OUT_Y],stop]}
function backPath(h,i){const d=DEFS[i],cy=CROSS[d.st];return d.st?[[d.x,cy+8],[TRUNK+8,cy+8],[TRUNK+8,BACK_Y],[h.x,BACK_Y],[h.x,HOLD_Y]]:[[d.x,BACK_Y],[h.x,BACK_Y],[h.x,HOLD_Y]]}
function leg(t,i,path){const km=kmOf(i);t.path=path;t.sp=pathLen(t)/(km*60/t.T.kmh*(G.cond.wx==='rain'?1.25:1)*(G.cond.road===i?1.4:1));
  const L=km*t.T.l/100*(G.sup.tr?.94:1),own=Math.min(G.tank,L);G.tank-=own;S.d.litres+=L;charge('fuel',(L-own)*price()*1.1+km*t.T.run);S.d.km+=km;t.km+=km;t.o.cond=Math.max(0,t.o.cond-km*.03)}
const pri=t=>t.inb&&(t.site>60||G.wh<30)?0:G.fkPri==='in'?(t.inb?1:2):G.fkPri==='out'?(t.inb?2:1):1,crowd=t=>S.forks.reduce((a,g)=>a+(g.truck===t?1:0),0);
const rackX=t=>Math.max(OX+24,Math.min(OX+DW-24,t.dock.x+Math.random()*150-75));
function toHold(t){t.dock.truck=null;t.dock=null;const h=S.holds.find(h=>!h.truck)||{x:HOLD_X[0],truck:null};h.truck=t;t.hold=h;t.path=[[t.x,HOLD_Y],[h.x,HOLD_Y]];t.sp=30;t.state='back'}
function refuse(t,why){if(t.dock){t.dock.truck=null;t.dock=null}if(t.hold){t.hold.truck=null;t.hold=null}charge('det',100);say('Supplier left with '+t.loaded+' pallets ('+why+'). $100 fee.');t.path=[[t.x,OUT_Y],[WW+60,OUT_Y]];t.state='leave'}
function step(dt){S.clock+=dt;
  charge('wF',(S.forks.length*PAY[G.pay].w+(G.sup.wh?SUPW:0))/60*dt);charge('wD',(S.trucks.filter(t=>!t.inb).length*DRIVER+(G.sup.tr?SUPW:0))/60*dt);
  const gap=G.inMode==='early'?20:Math.max(15,600/Math.max(1,Math.ceil(G.order/LOAD)));
  while(S.ordered<G.order&&S.clock>=375+gap*S.slot){S.slot++;const q=Math.min(LOAD,G.order-S.ordered);S.ordered+=q;supplier(q)}
  G.stores.forEach((s,i)=>{if(!s.on)return;s.flash=Math.max(0,s.flash-dt/3);s.next-=dt;while(s.next<=0){s.next+=expo(60/rate(i));
      if(s.stock>0){s.stock--;S.d.sold++;s.sat=Math.min(100,s.sat+.1)}else{s.flash=1;S.d.lost++;s.sat=Math.max(0,s.sat-.8);charge('pen',LOST)}}});
  for(const t of S.trucks){const T=t.T;if(t.inb){t.site+=dt;if(t.site>120)charge('det',dt)}
    if(t.state==='wait'){if(t.retire){if(t.hold)t.hold.truck=null;t.dead=1;continue}
      if(t.svc){t.svc=false;t.state='service';t.timer=120;charge('repair',T.svc);t.o.cond=100;continue}
      if(t.inb&&t.site>180){refuse(t,'gave up waiting');continue}
      const ok=t.inb?G.wh+S.whIn<whCap():G.wh-S.whRes>0&&!(G.wh<40&&S.trucks.some(u=>u.inb&&u.state==='wait'));
      const d=ok&&S.docks.find(d=>d.on&&!d.truck);if(d){d.truck=t;t.dock=d;t.hold.truck=null;t.hold=null;t.path=[[d.x,HOLD_Y],[d.x,DOOR_Y+5+T.len/2,1]];t.state='dockIn'}}
    else if(t.state==='service'){t.timer-=dt;if(t.timer<=0){t.state='wait';say(T.n+' #'+t.id+' is back from the workshop.')}}
    else if(t.state==='dockIn'){if(move(t,30,dt)){t.state='loading';t.store=-1;t.seq=S.seq++}}

  if(!speed&&S.clock<=360.1){m='Gates closed. Check today\'s conditions and your inbound order, then press a speed.';c='#1d1f21'}
  else if(!speed){m='Paused.';c='#1d1f21'}
  else if(G.wh-S.whRes<=0&&own.some(t=>t.state==='loading'&&t.store>=0)){m='The depot is out of stock. Trucks can\'t be loaded. Order more inbound or rush a load.';c='var(--bad)'}
  else if(late){m='A supplier truck has been kept over 2 hours. That costs $60 an hour, and after 3 hours it leaves.';c='var(--bad)'}
  else if(G.wh+S.whIn>=whCap()&&S.trucks.some(t=>t.inb)){m='The racks are full. Inbound stock can\'t be unloaded.';c='#f5a300'}
  else if(empty&&S.fUtil>.88&&atDepot){m='Forklifts are flat out and shelves are empty. Hire, raise pay or fit dock levellers.';c='var(--bad)'}
  else if(empty&&!atDepot){m='Shelves are empty and every truck is on the road. You need more truck capacity.';c='var(--bad)'}
  else if(empty&&wait&&!idleDock){m='Trucks are queuing for a dock while shelves sit empty.';c='var(--bad)'}
  else if(empty){m='A store has run out. Each empty-shelf sale costs '+money(LOST)+' and goodwill.';c='var(--bad)'}
  else if(!G.sup.wh&&S.forks.length>4){m='More than 4 operators and no supervisor: they\'re getting in each other\'s way.';c='#f5a300'}
  else if(!G.sup.tr&&G.fleet.length>4){m='More than 4 trucks and no transport supervisor: every departure waits on paperwork.';c='#f5a300'}
  else if(S.fUtil<.3&&S.forks.length>1&&S.clock>480){m='Operators are standing around. Idle hands still get paid.';c='#f5a300'}
  else m='Running smoothly.';
  $('#advice').textContent=m;$('#advice').style.borderLeftColor=c}
const seg=(act,opts,cur)=>`<div class="seg">${opts.map(o=>`<button data-act="${act}:${o[0]}" class="${o[0]===cur?'on':''}">${o[1]}</button>`).join('')}</div>`;
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.act==='tab:'+tab));
  document.querySelectorAll('#speed button').forEach(b=>b.classList.toggle('on',b.dataset.act==='speed:'+speed));
  let h='';
  if(tab==='team'){h=`<h3>Today</h3><ul class="cond">${condList(G.cond,G.day0).map(x=>'<li>'+x+'</li>').join('')}</ul>
    <h3>Stock in the depot</h3><div class="rowx"><div class="t"><b><span data-v="wh"></span> pallets</b><span>Storage costs $${STOR.toFixed(2)} a pallet each night</span></div><div class="meter"><i data-w="whp"></i></div></div>
    <h3>Pallet inflow</h3><p>Suppliers truck stock in, ${LOAD} pallets a load. Your forklifts unload them at the same docks your trucks use.</p>
    <div class="rowx"><div class="t"><b>${G.order} pallets a day</b><span>${Math.ceil(G.order/LOAD)} loads. <span data-v="ord"></span> pallets sent so far today. Stores want about <span data-v="need"></span> today.</span></div></div>
    <div class="seg" style="margin-bottom:8px"><button data-act="ord:-50">−50</button><button data-act="ord:-10">−10</button><button data-act="ord:10">+10</button><button data-act="ord:50">+50</button></div>
    ${seg('inm',[['spread','Spread out<small>evenly, 6:15 to 4pm</small>'],['early','Front-loaded<small>every 20 min from 6:15</small>']],G.inMode)}
    <div class="rowx"><div class="t"><b>Rush load</b><span>${LOAD} pallets on the way right now</span></div><button data-act="rush">Order ${money(RUSH)}</button></div>
    <h3>Forklift operators</h3><p>Each moves about ${(8*PAY[G.pay].sp*mm()*eff()).toFixed(1)} pallets an hour, in or out. Paid all day, busy or not.</p>
    <div class="rowx"><div class="t"><b>${G.fk} employed${S.sick?', '+S.sick+' off sick':''}</b><span>Busy <span data-v="futil"></span> of the time</span></div><div style="display:flex;gap:6px"><button data-act="fire" ${G.fk<=1?'disabled':''}>−</button><button data-act="hire" ${G.fk>=12?'disabled':''}>Hire ${money(HIRE)}</button></div></div>
    <div class="rowx"><div class="t"><b>Morale ${Math.round(G.morale)}</b><span>${G.morale<40?'Low: expect sick days and slow work':G.morale>75?'High: the crew works faster':'Steady'}. Moves overnight with pay and workload.</span></div><div class="meter"><i style="width:${G.morale}%;background:${G.morale>60?'var(--good)':G.morale>35?'#f5a300':'var(--bad)'}"></i></div></div>
    <h3>Forklift assignment</h3>${seg('fkm',[['auto','Auto<small>spread across docks</small>'],['manual','Manual<small>you pick the dock</small>']],G.fkMode)}
    ${G.fkMode==='manual'?'<div class="fkgrid">'+S.forks.map(f=>`<label>Forklift ${f.i+1}<select data-chg="fd:${f.i}"><option value="-1">Float</option>${S.docks.filter(d=>d.on).map((d,j)=>`<option value="${j}" ${G.fkDock[f.i]===j?'selected':''}>Dock ${j+1}</option>`).join('')}</select></label>`).join('')+'</div><p>A forklift pinned to a dock waits there when it has no truck. Floaters go wherever they are needed.</p>':'<p>Forklifts share themselves out between every truck at a dock.</p>'}
    <div style="margin-top:6px">${seg('fkp',[['bal','Balanced'],['out','Deliveries first'],['in','Inflow first']],G.fkPri)}</div>
    <h3>Supervisors</h3><div class="rowx"><div class="t"><b>Warehouse supervisor</b><span>$${SUPW}/h. Crew works 10% faster, fewer sick days, better morale. Without one, a crew over 4 slows down.</span></div><button data-act="sup:wh" class="${G.sup.wh?'on':''}">${G.sup.wh?'On staff':'Hire'}</button></div>
    <div class="rowx"><div class="t"><b>Transport supervisor</b><span>$${SUPW}/h. Trucks leave the moment they're loaded and burn 6% less fuel. Without one, a fleet over 4 waits on paperwork.</span></div><button data-act="sup:tr" class="${G.sup.tr?'on':''}">${G.sup.tr?'On staff':'Hire'}</button></div>
    <h3>Warehouse pay</h3>${seg('pay',PAY.map((p,i)=>[i,`${p.n}<small>$${p.w}/h · ${p.sp<1?'slower':p.sp>1?'faster':'normal'}</small>`]),G.pay)}
    <h3>Loading docks</h3><div class="rowx"><div class="t"><b>${G.docks} of 6 open</b><span>Shared by your trucks and suppliers. ${money(OVER_DOCK)} a day each.</span></div><button data-act="dock" ${G.docks>=6?'disabled':''}>Build ${money(DOCK)}</button></div>`}
  else if(tab==='fleet'){h=`<h3>Send a truck when it can carry at least</h3>${seg('min',[[.25,'¼ load'],[.5,'½ load'],[.75,'¾ load'],[1,'Full']],G.minLoad)}
    <p style="margin-top:6px">Small loads keep shelves full but burn kilometres. Full loads are cheap per pallet but stores wait.</p>
    <h3>Diesel</h3><div class="rowx"><div class="t"><b>$${price().toFixed(2)} a litre today</b><span>Trucks fill from your tank first. When it's dry they pay 10% more at the roadside ($${(price()*1.1).toFixed(2)}).</span></div><div class="bars" style="width:90px;height:38px;margin:0">${G.fuelHist.map((f,i)=>`<i style="height:${(f-.6)*100}%;background:${i===G.fuelHist.length-1?'#1d1f21':'#b9b6ad'}"></i>`).join('')}</div></div>
    <div class="rowx"><div class="t"><b>Depot tank: <span data-v="tank"></span></b><span>Buy when it's cheap, burn it when it's dear. Used today: <span data-v="lit"></span></span></div><div class="meter" style="width:70px"><i data-w="tankp"></i></div></div>
    <div class="seg"><button data-act="fuel:500">+500 L<small>${money(500*price())}</small></button><button data-act="fuel:2000">+2,000 L<small>${money(2000*price())}</small></button><button data-act="fuel:99999">Fill<small data-v="fillc"></small></button></div><h3>Your trucks</h3>`+
    S.trucks.filter(t=>!t.inb).map(t=>`<div class="truck"><div class="rowx"><div class="t"><b>${t.T.n} #${t.id}</b><span data-v="t${t.id}"></span></div><div class="meter" style="width:70px"><i data-w="c${t.id}"></i></div></div>
      <div class="trow"><select data-chg="route:${t.id}"><option value="-1">Any store</option>${onStores().map(i=>`<option value="${i}" ${t.o.route===i?'selected':''}>Only ${DEFS[i].n}</option>`).join('')}</select>
      <button data-act="svc:${t.id}" ${t.svc||t.state==='service'?'disabled':''}>Service ${money(t.T.svc)}</button><button data-act="ret:${t.id}" ${t.retire||G.fleet.length<=1?'disabled':''}>Return</button></div></div>`).join('')+
    `<p style="margin-top:8px">Condition wears down with every kilometre. Worn trucks break down far more often. A service takes 2 hours.</p><h3>Lease another</h3><p>Charged per day, starting now. Each comes with a driver at $${DRIVER}/h.</p>`+
    ['van','rigid','semi'].map(k=>{const T=TYPES[k];return`<div class="rowx"><div class="t"><b>${T.n} · ${T.cap} pallets</b><span>${money(T.lease)}/day · ${T.l} L/100 km · $${perKm(T).toFixed(2)}/km today · ${T.kmh} km/h</span></div><button data-act="lease:${k}" ${G.fleet.length>=16?'disabled':''}>Lease</button></div>`}).join('')}
  else if(tab==='stores'){h='<h3>Contracts</h3>'+G.stores.map((s,i)=>{const d=DEFS[i];return s.on?`<div class="rowx"><div class="t"><b>${d.n}${G.cond.promo===i?'<span class="tag">PROMO</span>':''}${G.cond.road===i?'<span class="tag">ROADWORKS</span>':''}</b><span>${d.km} km · ${money(d.rate)}/pallet · wants <span data-v="r${i}"></span>/h<br>Stock <span data-v="s${i}"></span> · Goodwill <span data-v="g${i}"></span></span></div><div class="meter"><i data-w="g${i}"></i></div></div>`:''}).join('');
    const o=nextOffer();h+=o>=0?`<p style="margin-top:10px">Next contract: <b style="color:var(--ink)">${DEFS[o].n}</b>, ${DEFS[o].km} km, ${money(DEFS[o].rate)}/pallet. Offered after a day with shelves stocked 90%+.</p>`:'<p style="margin-top:10px">You hold every contract in the region.</p>';
    h+=`<p>Goodwill rises with every sale and drops with every empty-shelf visit. At zero, the store cancels.</p>`}
  else if(tab==='invest'){h='<h3>Upgrades</h3>'+Object.entries(UPS).map(([k,u])=>`<div class="rowx"><div class="t"><b>${u[0]}</b><span>${u[2]}</span></div><button data-act="up:${k}" ${(k==='rack'?G.up.rack>=4:G.up[k])||G.cash<u[1]?'disabled':''}>${k==='rack'?(G.up.rack>=4?'Maxed':money(u[1])+' ('+(G.up.rack||0)+'/4)'):G.up[k]?'Owned':money(u[1])}</button></div>`).join('')+
    `<h3>Bank loan</h3><div class="rowx"><div class="t"><b>Owing ${money(G.loan)}</b><span>${(LOAN_RATE*100).toFixed(1)}% interest a day (${money(G.loan*LOAN_RATE)} tomorrow). Limit ${money(LOAN_MAX)}.</span></div><div style="display:flex;gap:6px"><button data-act="repay" ${G.loan<=0||G.cash<LOAN_STEP?'disabled':''}>Repay</button><button data-act="borrow" ${G.loan>=LOAN_MAX?'disabled':''}>+${money(LOAN_STEP)}</button></div></div>
    <h3>Standing</h3><p>${TIERS.map((t,i)=>`${i<G.tier?'✅':'⬜'} ${t[1]}: ${money(t[0])} net worth`).join('<br>')}</p><p>Net worth is cash minus what you owe: <b style="color:var(--ink)">${money(G.cash-G.loan)}</b>.</p>`}
  else{const mx=Math.max(1,...G.hist.slice(-14).map(x=>Math.abs(x.profit)));h=`<h3>Today so far</h3><table><tr><td>Delivery income</td><td data-v="lrev"></td></tr><tr><td>Wages</td><td data-v="lwage"></td></tr><tr><td>Fuel and running</td><td data-v="lfuel"></td></tr><tr><td>Leases, rent, interest</td><td data-v="lfix"></td></tr><tr><td>Penalties, fees, repairs</td><td data-v="lpen"></td></tr><tr><td>Investments and one-offs</td><td data-v="loth"></td></tr>
    <tr class="tot"><td>Profit</td><td data-v="lprof"></td></tr><tr><td>Kilometres driven</td><td data-v="lkm"></td></tr><tr><td>Pallets out / in</td><td data-v="ldel"></td></tr><tr><td>Cost per pallet</td><td data-v="lcpp"></td></tr><tr><td>Shelves stocked</td><td data-v="lav"></td></tr></table>
    <h3>Profit by day</h3>`+(G.hist.length?`<div class="bars">${G.hist.slice(-14).map(x=>`<i title="Day ${x.day}" style="height:${Math.max(4,Math.abs(x.profit)/mx*100)}%;background:${x.profit<0?'var(--bad)':'var(--good)'}"></i>`).join('')}</div><table>`+G.hist.slice(-5).reverse().map(x=>`<tr><td>Day ${x.day} · ${(x.avail*100).toFixed(0)}% stocked</td><td class="${x.profit<0?'neg':'pos'}">${money(x.profit)}</td></tr>`).join('')+'</table>':'<p>Nothing yet.</p>')+
    `<h3>Log</h3><p data-v="log" style="white-space:pre-line"></p><button data-act="restart" style="margin-top:6px">Start a new game</button>`}
  $('#panel').innerHTML=h;live()}
function live(){const d=S.d,pr=d.rev-costs(d),v={futil:(S.fUtil*100).toFixed(0)+'%',wh:G.wh+' of '+whCap(),whp:G.wh/whCap()*100,tank:Math.round(G.tank).toLocaleString()+' of '+tankCap().toLocaleString()+' L',tankp:G.tank/tankCap()*100,lit:Math.round(d.litres).toLocaleString()+' L',fillc:money((tankCap()-G.tank)*price()),need:Math.round(onStores().reduce((a,i)=>a+DEFS[i].dem,0)*12.3*S.dayMul*(G.cond.wx==='heat'?1.25:G.cond.wx==='rain'?.9:1)),ord:Math.min(S.ordered,9999),lrev:money(d.rev),lwage:money(-d.wF-d.wD),lfuel:money(-d.fuel),lfix:money(-d.lease-d.over-d.int),lpen:money(-d.pen-d.repair-d.det),loth:money(-d.other),lprof:money(pr),lkm:Math.round(d.km)+' km',ldel:d.deliv+' / '+d.recv,
    lcpp:d.deliv?money((costs(d)-d.other)/d.deliv):'–',lav:(d.sold/Math.max(1,d.sold+d.lost)*100).toFixed(0)+'%',log:S.log.slice(0,8).join('\n')};
  S.trucks.forEach(t=>{if(!t.inb){v['t'+t.id]=tStatus(t)+' · '+Math.round(t.km)+' km today · condition '+Math.round(t.o.cond)+'%';v['c'+t.id]=t.o.cond}});
  G.stores.forEach((s,i)=>{if(s.on){v['r'+i]=rate(i).toFixed(1);v['s'+i]=s.stock+'/'+cap(i);v['g'+i]=Math.round(s.sat)}});
  document.querySelectorAll('[data-v]').forEach(e=>{const t=v[e.dataset.v];if(t!==undefined&&e.textContent!==String(t))e.textContent=t});
  document.querySelectorAll('[data-w]').forEach(e=>{const g=+v[e.dataset.w];e.style.width=g+'%';e.style.background=g>60?'var(--good)':g>30?'#f5a300':'var(--bad)'});
  $('#hDay').textContent='Day '+G.day0+' · '+DAYS[(G.day0-1)%7];$('#hTime').textContent=clockStr();$('#hCash').textContent=money(G.cash);$('#hCash').className=G.cash<0?'neg':'';
  $('#hToday').textContent=(pr>0?'+':'')+money(pr);$('#hToday').className=pr<0?'neg':'pos';advice()}
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(!el)return;const[k,v]=el.dataset.chg.split(':');if(k==='fd'){G.fkDock[+v]=+el.value;return}const o=G.fleet.find(o=>o.id===+v);if(o)o.route=+el.value});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const[a,p]=b.dataset.act.split(':');
  if(a==='tab')tab=p;else if(a==='speed')speed=+p;
  else if(a==='hire'){G.fk++;charge('other',HIRE);syncForks()}else if(a==='fire'){G.fk--;syncForks()}
  else if(a==='fkm')G.fkMode=p;else if(a==='fkp')G.fkPri=p;else if(a==='pay')G.pay=+p;else if(a==='inm')G.inMode=p;else if(a==='sup'){G.sup[p]=!G.sup[p];say((p==='wh'?'Warehouse':'Transport')+' supervisor '+(G.sup[p]?'hired.':'let go.'))}
  else if(a==='view')view(p);else if(a==='zoom'){const c=$('#c');zoomAt(+p,c.clientWidth/2,c.clientHeight/2)}
  else if(a==='fuel'){const L=Math.min(+p,tankCap()-G.tank),cost=L*price();if(L<=0||G.cash<cost){say(L<=0?'The tank is full.':'Not enough cash for that much diesel.');return}G.tank+=L;charge('fuel',cost);say('Bought '+Math.round(L).toLocaleString()+' L of diesel.')}else if(a==='min')G.minLoad=+p;
  else if(a==='ord')G.order=Math.max(0,Math.min(MAXORD,G.order+ +p));
  else if(a==='rush'){charge('other',RUSH);supplier(LOAD);say('Rush load of '+LOAD+' pallets is on its way.')}
  else if(a==='dock'){if(G.cash<DOCK){say('Not enough cash to build a dock.');return}S.docks[G.docks].on=true;G.docks++;charge('other',DOCK);say('New dock open.')}
  else if(a==='lease'){const o={id:G.nid++,type:p,cond:100,route:-1};G.fleet.push(o);addTruck(o);charge('lease',TYPES[p].lease);say(TYPES[p].n+' #'+o.id+' leased.')}
  else if(a==='ret'){const t=S.trucks.find(t=>t.id==p);if(t){t.retire=true;G.fleet=G.fleet.filter(o=>o.id!=p)}}
  else if(a==='svc'){const t=S.trucks.find(t=>t.id==p);if(t){t.svc=true;say(t.T.n+' #'+t.id+' booked for a service.')}}
  else if(a==='up'){const u=UPS[p];if(G.cash<u[1])return;if(p==='rack')G.up.rack=(G.up.rack||0)+1;else G.up[p]=true;charge('other',u[1]);if(p==='mess')G.morale=Math.min(100,G.morale+10);say(u[0]+' installed.')}
  else if(a==='borrow'){G.loan+=LOAN_STEP;G.cash+=LOAN_STEP;say('Borrowed '+money(LOAN_STEP)+'.')}
  else if(a==='repay'){G.loan-=LOAN_STEP;G.cash-=LOAN_STEP;say('Repaid '+money(LOAN_STEP)+'.')}
  else if(a==='accept'){G.stores[p].on=true;G.stores[p].stock=Math.round(DEFS[p].cap*.5);G.stores[p].sat=70;G.order=Math.min(MAXORD,G.order+Math.round(DEFS[p].dem*13/10)*10);save();$('#offer').innerHTML='<b class="pos">Contract signed: '+DEFS[p].n+'.</b><p style="margin:4px 0 0">Inbound order raised to '+G.order+' a day to cover it.</p>';return}
  else if(a==='next'){hideModal();begin()}
  else if(a==='new'){newGame();hideModal();begin()}
  else if(a==='restart'){if(confirm('Start a new game? Your current depot will be lost.')){newGame();begin()}}
  else if(a==='continue'){hideModal()}
  render()});
function begin(){G.day0=G.day;speed=0;startDay()}

G=load();const resumed=!!G;if(!G)newGame();begin();
showModal(`<h2>Pallet Flow: Depot Manager</h2><p>You run a depot. Stores pay you for every pallet delivered and fine you for every shopper who finds an empty shelf.</p>
<ul><li><b>Depot:</b> order inbound stock, hire forklift operators and supervisors, set pay, watch morale.</li><li><b>Map:</b> drag to move, pinch to zoom. Ten stores are out there.</li><li><b>Fleet:</b> lease vans, rigids or semis, give them routes, keep them serviced. Every kilometre costs fuel.</li><li><b>Stores:</b> keep shelves 90% stocked to win further, better-paying contracts.</li><li><b>Invest:</b> upgrades, and a bank loan if you want to grow faster.</li><li><b>Ledger:</b> watch cost per pallet. That number is the game.</li></ul>
<p>Each day starts paused so you can plan around the weather, fuel price and promos. Days run 6am to 6pm. Progress saves each night.</p>
<button class="pri go" data-act="${resumed?'continue':'new'}">${resumed?'Continue day '+G.day:'Open the depot'}</button>${resumed?'<button class="go" data-act="new">New game</button>':''}`);
let last=performance.now(),acc=0,uiT=0;
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!modal&&!S.over&&speed){acc+=dt*speed*2;let n=0;while(acc>.1&&n<40&&!S.over){step(.1);acc-=.1;n++}if(n===40)acc=0}
  draw();uiT+=dt;if(uiT>.35){uiT=0;if(!S.over)live()}requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script>
