# Move this file to .github/workflows/desktop.yml to build the desktop app on GitHub.
# Run it from the Actions tab ("Run workflow"). Zips for Windows, macOS and Linux appear as artifacts.
name: Desktop build
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: desktop
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: pallet-flow-demo-${{ matrix.os }}
          path: desktop/dist/*.zip
